name: Sync with Hugging Face Space

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # CRITICAL: Required to fetch full history for git push to work
          lfs: true      # Optional: Enable if you are using large files (LFS)

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push https://irfan:$HF_TOKEN@huggingface.co/spaces/24f2007597/tds_project_2 main
